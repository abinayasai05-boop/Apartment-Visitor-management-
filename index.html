<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartment Visitor Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🏢 Apartment Visitor Management</h1>
    </header>

    <div class="container">

        <!-- Visitor Entry -->
        <div class="card">
            <h2>Visitor Entry</h2>

            <input type="text" placeholder="Visitor Name">
            <input type="text" placeholder="Phone Number">
            <input type="text" placeholder="Purpose of Visit">

            <button>Register Visitor</button>
        </div>

        <!-- QR Pass -->
        <div class="card">
            <h2>QR Pass</h2>

            <div class="qr-box">
                QR PASS
            </div>

            <button>Generate QR Pass</button>
        </div>

        <!-- Resident Dashboard -->
        <div class="card">
            <h2>Resident Dashboard</h2>

            <div class="info">
                <p>Total Visitors Today: <strong>18</strong></p>
                <p>Pending Approvals: <strong>4</strong></p>
                <p>Approved Visitors: <strong>14</strong></p>
            </div>
        </div>

        <!-- Security Panel -->
        <div class="card">
            <h2>Security Panel</h2>

            <table>
                <tr>
                    <th>Name</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>Rahul</td>
                    <td class="approved">Approved</td>
                </tr>

                <tr>
                    <td>Priya</td>
                    <td class="pending">Pending</td>
                </tr>

                <tr>
                    <td>Arun</td>
                    <td class="approved">Approved</td>
                </tr>
            </table>
        </div>

    </div>

</body>
</html>
